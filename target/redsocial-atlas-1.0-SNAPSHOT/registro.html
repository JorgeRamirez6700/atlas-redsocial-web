<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Registro de Usuario</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="login.html">Iniciar Sesión</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="registro">
            <h2>Crea tu cuenta</h2>
            <form id="formRegistro">
                <label for="username">Nombre de usuario:</label>
                <input type="text" id="username" name="username" required minlength="4" maxlength="20" pattern="[a-zA-Z0-9]+" 
                       title="El nombre de usuario debe contener entre 4 y 20 caracteres alfanuméricos.">

                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required minlength="6" 
                       title="La contraseña debe contener al menos 6 caracteres.">

                <label for="avatar">Avatar:</label>
                <input type="file" id="avatar" name="avatar" accept="image/png, image/jpeg">

                <button type="submit">Registrarse</button>
            </form>
            <div id="errorMsg" style="color:red;"></div>
        </section>
    </main>
    <footer>
        <p>© 2024 Atlas Social. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
